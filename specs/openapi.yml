openapi: "3.2.1"

info:
  title: "Electrotech Backend"
  summary: "Specification for Electrotech shop backend API"
  version: "2.0.0"
  contact:
    name: "Anton Petrov"
    email: "petrovanton247@gmail.com"

servers:
  - url: https://shop-icentr.pro
    description: "Production server"

tags:
  - name: "meta"
    description: "Meta endpoints for checking service"
  - name: "orders"
    description: "Managing user orders"

paths:
  "/api/v3/health":
    get:
      security: []
      tags: ["meta"]
      description: "Returns service health status"
      operationId: GetHealth
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "502":
          $ref: "#/components/responses/HealthResponse"
  "/api/v3/orders":
    get:
      security:
        - jwtAuth: []
      tags: ["orders"]
      operationId: "GetOrders"
      responses:
        default:
          $ref: "#/components/responses/BadResponse"
        "200":
          $ref: "#/components/responses/GetOrdersResponse"
    post:
      security:
        - jwtAuth: []
      tags: ["orders"]
      operationId: "CreateOrder"
      requestBody:
        $ref: "#/components/requestBodies/CreateOrderRequest"
      responses:
        default:
          $ref: "#/components/responses/BadResponse"
        "201":
          $ref: "#/components/responses/CreateOrderResponse"
security:
  - jwtAuth: []
components:
  securitySchemes:
    jwtAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Problem:
      type: object
      required: [type, status, title]
      properties:
        type:
          type: string
        status:
          type: number
          format: int
        title:
          type: string
        detail:
          type: string
    HealthStatus:
      type: string
      enum:
        - ok
        - unavailable
    Health:
      type: object
      required: [status, dependencies]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        dependencies:
          type: object
          required: ["db"]
          properties:
            db:
              $ref: "#/components/schemas/HealthStatus"
    OrderProduct:
      type: object
      required:
        [id, orderId, productName, quantity, productPrice, productId, imagePath]
      properties:
        id:
          type: number
          format: int64
        orderId:
          type: number
          format: int64
        productName:
          type: string
        quantity:
          type: number
          format: int64
          minimum: 1
        productPrice:
          type: number
          format: float64
        productId:
          type: string
        imagePath:
          type: string

    Order:
      type: object
      required: ["id", "userId", "creationDate", "products"]
      properties:
        id:
          type: number
          format: int64
        userId:
          type: number
          format: int64
        creationDate:
          type: string
        products:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderProduct"
  requestBodies:
    CreateOrderRequest:
      required: true
      content:
        "application/json":
          schema:
            type: object
            required: [products]
            properties:
              products:
                type: array
                maxItems: 1
                items:
                  type: object
                  required: [id, quantity]
                  properties:
                    id:
                      type: string
                    quantity:
                      type: number
                      format: int64
                      minimum: 1
  responses:
    BadResponse:
      description: "Default bad response that describes problem"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Problem"
    HealthResponse:
      description: "Health response containing status of sesrvice and its dependencies"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Health"
    GetOrdersResponse:
      description: "Response with orders list"
      content:
        "application/json":
          schema:
            type: object
            properties:
              orders:
                type: array
                minItems: 0
                items:
                  $ref: "#/components/schemas/Order"
    CreateOrderResponse:
      description: "Returns on order created"
      content:
        "application/json":
          schema:
            type: object
            required: [orderId]
            properties:
              orderId:
                type: number
                format: int64
