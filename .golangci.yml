version: "2"

linters:
  default: all
  disable:
    # deprecated
    - wsl
    - gomodguard
    # temporary
    - gochecknoglobals
    - tagliatelle
    - godox
    # own style
    - depguard
    - revive
    - varnamelen
    - exhaustruct
    - noinlineerr
    - recvcheck
    - musttag
    - testpackage
    - forbidigo
